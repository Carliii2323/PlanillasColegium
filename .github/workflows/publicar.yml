# Publica la página en GitHub Pages cada vez que se sube un cambio a main.
# Sigue la misma estructura que el flujo oficial de GitHub (compilar y publicar en dos trabajos),
# que es la que funcionó en este repositorio.
# Requisito: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, espera a que termine la anterior.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # v4 usa la misma versión de la librería de artefactos que deploy-pages v5.
      - name: Subir la página
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: './dist'

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
